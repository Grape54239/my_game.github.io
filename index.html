<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Developer Portfolio</title>
  <style>
    :root {
      --bg: #0d0f17;
      --card-bg: #161926;
      --accent: #ff2a6d;
      --accent-cyan: #05d9e8;
      --text: #ffffff;
      --text-dim: #94a3b8;
      --border: #2a2e45;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem 1rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    header h1 {
      font-size: 2.5rem;
      color: var(--accent-cyan);
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-dim);
      font-size: 1.1rem;
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }

    .project-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .project-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-cyan);
    }

    .card-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background-color: #222;
    }

    .card-content {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-content h2 {
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
    }

    .card-content p {
      color: var(--text-dim);
      font-size: 0.95rem;
      margin-bottom: 1rem;
      flex-grow: 1;
    }

    .play-btn {
      display: inline-block;
      text-align: center;
      background-color: var(--accent);
      color: var(--text);
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-weight: bold;
      transition: opacity 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .play-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <header>
    <h1>MY PORTFOLIO</h1>
    <p>Check out my GameMaker projects made for web browsers!</p>
  </header>

  <main class="portfolio-grid">

    <!-- GAME 1 -->
    <div class="project-card">
      <!-- Preview image in your 'images' folder -->
      <img src="images/logo.png" alt="Space Defender Preview" class="card-img">
      <div class="card-content">
        <h2>Lil Guy's Music Studio</h2>
        <p>A fun project I made where you make a little guy sing</p>
        <!-- Opens index.html inside the 'space-defender' game folder -->
        <a href="singinlilguy_222/index.html" class="play-btn">Play Game</a>
      </div>
    </div>
      <!-- GAME 2 -->
    <div class="project-card">
      <!-- Preview image in your 'images' folder -->
      <img src="images/heythere.png" alt="Space Defender Preview" class="card-img">
      <div class="card-content">
        <h2>showdown!!</h2>
        <p>Shoot the targets to get a high score</p>
        <!-- Opens index.html inside the 'space-defender' game folder -->
        <a href="wild_west2/index.html" class="play-btn">Play Game</a>
      </div>
    </div>


  </main>

</body>
</html>
